<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전기기능사 AI 도우미 — 챗봇 소식지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:           #212121;
            --bg-side:      #171717;
            --bg-side-hover:#2a2a2a;
            --bg-input:     #2f2f2f;
            --bg-msg-user:  #2f2f2f;
            --bg-code:      #0d0d0d;
            --bg-soft:      #1a1a1a;
            --border:       #2a2a2a;
            --border-soft:  #333333;
            --text:         #ececec;
            --text-mute:    #b4b4b4;
            --text-dim:     #8e8e8e;
            --accent:       #10a37f;   /* GPT green */
            --accent-claude:#cc785c;   /* Claude rust */
            --accent-blue:  #5b8def;
            --warn:         #f5a524;
            --danger:       #ef4444;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            font-size: 15px; line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        code, pre, .mono { font-family: 'JetBrains Mono', SFMono-Regular, Consolas, Menlo, monospace; }

        /* ===== Layout shell ===== */
        .app {
            display: grid;
            grid-template-columns: 260px 1fr;
            height: 100vh;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            background: var(--bg-side);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .side-head {
            padding: 10px 12px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid transparent;
        }
        .brand {
            display: inline-flex; align-items: center; gap: 8px;
            font-weight: 600; font-size: 14px;
            padding: 6px 8px; border-radius: 8px;
        }
        .brand:hover { background: var(--bg-side-hover); cursor: pointer; }
        .brand-logo {
            width: 22px; height: 22px; border-radius: 6px;
            background: linear-gradient(135deg, var(--accent) 0%, #0d8c6a 100%);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; color: #fff;
        }
        .icon-btn {
            width: 30px; height: 30px; border-radius: 8px;
            display: inline-flex; align-items: center; justify-content: center;
            color: var(--text-mute); cursor: pointer;
            transition: background 0.15s;
        }
        .icon-btn:hover { background: var(--bg-side-hover); color: var(--text); }

        .new-chat {
            margin: 6px 10px 10px;
            padding: 10px 12px;
            display: flex; align-items: center; gap: 10px;
            font-size: 14px; font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid var(--border-soft);
        }
        .new-chat:hover { background: var(--bg-side-hover); }
        .new-chat .plus {
            width: 18px; height: 18px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 14px; line-height: 1;
        }

        .side-search {
            margin: 0 10px 10px;
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px;
            background: var(--bg-side-hover);
            border-radius: 8px;
            font-size: 13px; color: var(--text-mute);
            cursor: pointer;
        }
        .side-search:hover { background: #333; }

        .side-section {
            padding: 6px 18px 4px;
            font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
            color: var(--text-dim);
            text-transform: uppercase;
        }
        .chat-list {
            flex: 1; overflow-y: auto;
            padding: 0 8px 12px;
        }
        .chat-item {
            display: block;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 14px; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            cursor: pointer;
            margin-bottom: 2px;
            position: relative;
        }
        .chat-item:hover { background: var(--bg-side-hover); }
        .chat-item.active { background: var(--bg-side-hover); }
        .chat-item .dot {
            display: none;
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            color: var(--text-mute);
            font-size: 18px; padding: 0 4px;
        }
        .chat-item:hover .dot, .chat-item.active .dot { display: inline; }

        .side-foot {
            padding: 10px;
            border-top: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
            cursor: pointer;
        }
        .side-foot:hover { background: var(--bg-side-hover); }
        .avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #5b8def, #8a67ab);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; color: #fff;
        }
        .user-name { font-size: 13px; font-weight: 500; }
        .user-plan { font-size: 11px; color: var(--text-dim); }

        /* ===== Main ===== */
        .main {
            display: flex; flex-direction: column;
            min-width: 0;
            background: var(--bg);
        }
        .topbar {
            height: 56px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid var(--border);
        }
        .model-picker {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px; border-radius: 10px;
            font-size: 15px; font-weight: 600;
            cursor: pointer;
            color: var(--text);
        }
        .model-picker:hover { background: var(--bg-side-hover); }
        .model-picker .caret { color: var(--text-mute); font-size: 12px; }
        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 11px; font-weight: 600;
            padding: 2px 7px; border-radius: 999px;
            background: rgba(16,163,127,0.15); color: var(--accent);
            margin-left: 4px;
        }
        .top-actions {
            display: flex; align-items: center; gap: 6px;
        }
        .top-actions .share, .top-actions .more {
            padding: 6px 12px; border-radius: 10px;
            font-size: 13px; color: var(--text-mute);
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
        }
        .top-actions .share:hover, .top-actions .more:hover { background: var(--bg-side-hover); color: var(--text); }

        /* Model dropdown */
        .model-menu {
            position: absolute; top: 50px; left: 18px;
            background: #2a2a2a; border: 1px solid var(--border-soft);
            border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.5);
            min-width: 320px; padding: 6px;
            z-index: 50;
            display: none;
        }
        .model-menu.open { display: block; }
        .model-row {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 10px 12px; border-radius: 8px;
            cursor: pointer;
        }
        .model-row:hover { background: var(--bg-side-hover); }
        .model-mark {
            width: 22px; height: 22px; border-radius: 6px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; color: #fff;
            flex-shrink: 0; margin-top: 1px;
        }
        .mark-gpt   { background: linear-gradient(135deg, #10a37f, #0a7b5e); }
        .mark-claude{ background: linear-gradient(135deg, #cc785c, #a85a42); }
        .mark-gem   { background: linear-gradient(135deg, #5b8def, #8a67ab); }
        .model-name { font-size: 14px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .model-desc { font-size: 12px; color: var(--text-mute); margin-top: 2px; }
        .model-check { color: var(--accent); margin-left: auto; }

        /* ===== Chat scroll area ===== */
        .chat-scroll {
            flex: 1; overflow-y: auto;
            scroll-behavior: smooth;
        }
        .chat-inner {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 24px 16px;
        }
        .turn {
            margin: 22px 0;
        }
        .turn.user { display: flex; justify-content: flex-end; }
        .bubble-user {
            background: var(--bg-msg-user);
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            white-space: pre-wrap;
            font-size: 15px;
        }
        .turn.ai .ai-row {
            display: flex; gap: 14px; align-items: flex-start;
        }
        .ai-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: #10a37f;
            flex-shrink: 0; margin-top: 2px;
            border: 1px solid #e5e5e5;
        }
        .ai-body { flex: 1; min-width: 0; }
        .ai-body p { margin: 0 0 12px; }
        .ai-body p:last-child { margin-bottom: 0; }
        .ai-body h3 {
            margin: 18px 0 10px; font-size: 17px; font-weight: 700;
        }
        .ai-body ul, .ai-body ol {
            margin: 0 0 14px; padding-left: 22px;
        }
        .ai-body li { margin: 4px 0; }
        .ai-body strong { color: #fff; font-weight: 600; }
        .ai-body em { color: var(--text-mute); font-style: italic; }

        .ai-body code:not(pre code) {
            background: var(--bg-code);
            padding: 1px 6px; border-radius: 5px;
            font-size: 13px; color: #e8a87c;
            border: 1px solid var(--border-soft);
        }
        .ai-body pre {
            background: var(--bg-code);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            margin: 0 0 14px;
            overflow: hidden;
        }
        .ai-body pre .codehead {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 12px;
            font-size: 12px; color: var(--text-mute);
            background: #0a0a0a;
            border-bottom: 1px solid var(--border-soft);
        }
        .ai-body pre .copy-code {
            cursor: pointer; padding: 2px 6px; border-radius: 6px;
            font-size: 11px; color: var(--text-mute);
        }
        .ai-body pre .copy-code:hover { background: #1f1f1f; color: var(--text); }
        .ai-body pre code {
            display: block;
            padding: 12px 14px;
            font-size: 13px; line-height: 1.55;
            color: #e8e8e8;
            white-space: pre;
            overflow-x: auto;
        }
        .tok-kw  { color: #ff7b72; }
        .tok-fn  { color: #d2a8ff; }
        .tok-str { color: #a5d6ff; }
        .tok-num { color: #79c0ff; }
        .tok-cm  { color: #8b949e; font-style: italic; }

        .ai-body table {
            width: 100%; border-collapse: collapse;
            margin: 0 0 14px; font-size: 13px;
            border: 1px solid var(--border-soft); border-radius: 8px; overflow: hidden;
        }
        .ai-body th, .ai-body td {
            border-bottom: 1px solid var(--border-soft);
            padding: 8px 12px; text-align: left;
        }
        .ai-body th {
            background: #1a1a1a; color: var(--text);
            font-weight: 600; font-size: 12px;
            text-transform: uppercase; letter-spacing: 0.04em;
        }
        .ai-body tr:last-child td { border-bottom: 0; }
        .ai-body td { color: var(--text-mute); }
        .ai-body td:first-child { color: var(--text); font-weight: 500; }

        .ai-body blockquote {
            border-left: 3px solid var(--accent);
            background: rgba(16,163,127,0.06);
            padding: 10px 14px; margin: 0 0 14px;
            border-radius: 0 8px 8px 0;
            color: var(--text-mute);
            font-size: 14px;
        }
        .ai-body blockquote.warn { border-left-color: var(--warn); background: rgba(245,165,36,0.08); }

        /* LaTeX-ish equation block */
        .eq-block {
            background: #181818;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            padding: 14px 18px;
            margin: 0 0 14px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px; color: #f5f5f5;
            letter-spacing: 0.02em;
        }
        .eq-block .frac {
            display: inline-flex; flex-direction: column; vertical-align: middle;
            text-align: center; margin: 0 4px;
        }
        .eq-block .frac .num { border-bottom: 1px solid #ccc; padding: 0 6px 2px; }
        .eq-block .frac .den { padding: 2px 6px 0; }
        .eq-inline { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #e8a87c; }

        /* Action bar under AI */
        .ai-actions {
            display: flex; align-items: center; gap: 2px;
            margin-top: 8px; margin-left: 42px;
            opacity: 0.55; transition: opacity 0.15s;
        }
        .turn.ai:hover .ai-actions { opacity: 1; }
        .ai-actions .act {
            width: 30px; height: 30px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 6px;
            color: var(--text-mute);
            cursor: pointer;
        }
        .ai-actions .act:hover { background: var(--bg-side-hover); color: var(--text); }
        .ai-actions .act.copied { color: var(--accent); }
        .ai-actions .act.good-on { color: var(--accent); }
        .ai-actions .act.bad-on { color: var(--danger); }
        .ai-actions .model-tag {
            margin-left: 8px; font-size: 11px; color: var(--text-dim);
        }

        /* Typing cursor */
        .cursor::after {
            content: "▊";
            margin-left: 2px;
            animation: blink 1s steps(2, start) infinite;
            color: var(--text-mute);
        }
        @keyframes blink { to { visibility: hidden; } }

        /* ===== Composer ===== */
        .composer-wrap {
            padding: 0 18px 18px;
            background: var(--bg);
        }
        .composer {
            max-width: 760px;
            margin: 0 auto;
            background: var(--bg-input);
            border: 1px solid var(--border-soft);
            border-radius: 22px;
            padding: 8px 8px 8px 14px;
            box-shadow: 0 6px 22px rgba(0,0,0,0.25);
            transition: border-color 0.15s;
        }
        .composer:focus-within { border-color: #4d4d4d; }
        .composer-row1 {
            display: flex; align-items: flex-end; gap: 8px;
        }
        .composer textarea {
            flex: 1;
            background: transparent;
            border: none; outline: none; resize: none;
            color: var(--text);
            font-family: inherit; font-size: 15px;
            line-height: 1.5;
            padding: 10px 4px;
            max-height: 200px;
            min-height: 24px;
        }
        .composer textarea::placeholder { color: var(--text-dim); }
        .send-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--text);
            color: var(--bg);
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s, opacity 0.15s;
        }
        .send-btn.disabled { opacity: 0.35; cursor: not-allowed; }
        .send-btn:not(.disabled):hover { background: #fff; }

        .composer-row2 {
            display: flex; align-items: center; gap: 6px;
            padding: 4px 4px 2px;
        }
        .tool-chip {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px; color: var(--text-mute);
            cursor: pointer; user-select: none;
            border: 1px solid transparent;
        }
        .tool-chip:hover { background: var(--bg-side-hover); color: var(--text); }
        .tool-chip.on {
            background: rgba(16,163,127,0.12);
            border-color: rgba(16,163,127,0.4);
            color: var(--accent);
        }
        .tool-chip svg { width: 16px; height: 16px; }
        .composer-foot {
            max-width: 760px; margin: 8px auto 0;
            text-align: center;
            font-size: 12px; color: var(--text-dim);
        }

        /* Scrollbars */
        .chat-scroll::-webkit-scrollbar, .chat-list::-webkit-scrollbar { width: 8px; }
        .chat-scroll::-webkit-scrollbar-thumb, .chat-list::-webkit-scrollbar-thumb {
            background: #3a3a3a; border-radius: 8px;
        }
        .chat-scroll::-webkit-scrollbar-track, .chat-list::-webkit-scrollbar-track { background: transparent; }

        /* Toast */
        .toast {
            position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
            background: #303030; color: var(--text);
            padding: 8px 14px; border-radius: 999px;
            font-size: 13px; font-weight: 500;
            box-shadow: 0 8px 22px rgba(0,0,0,0.4);
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 100;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

        @media (max-width: 820px) {
            .app { grid-template-columns: 1fr; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
        <div class="side-head">
            <div class="brand">
                <span class="brand-logo">⚡</span>
                <span>전기기능사 AI</span>
            </div>
            <div class="icon-btn" title="사이드바 접기">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
            </div>
        </div>

        <div class="new-chat" id="newChatBtn">
            <span class="plus">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
            </span>
            <span>새 대화</span>
        </div>

        <div class="side-search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <span>대화 검색</span>
        </div>

        <div class="side-section">오늘</div>
        <nav class="chat-list" id="chatList">
            <!-- populated by JS -->
        </nav>

        <div class="side-foot">
            <span class="avatar">서</span>
            <div style="flex:1; min-width:0;">
                <div class="user-name">서연 · 학습러</div>
                <div class="user-plan">Plus · 합격 D-42</div>
            </div>
            <div class="icon-btn" title="설정">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </div>
        </div>
    </aside>

    <!-- ===== Main ===== -->
    <main class="main">
        <div class="topbar" style="position:relative;">
            <div class="model-picker" id="modelPicker">
                <span id="currentModelName">GPT-4o</span>
                <span class="caret">▾</span>
                <span class="badge" id="currentModelBadge">기본</span>
            </div>
            <div class="model-menu" id="modelMenu">
                <div class="model-row" data-model="gpt">
                    <span class="model-mark mark-gpt">G</span>
                    <div style="flex:1;">
                        <div class="model-name">GPT-4o <span class="badge" style="background:rgba(91,141,239,0.18); color:#5b8def;">멀티모달</span></div>
                        <div class="model-desc">빠르고 똑똑함 · 코드·이미지·표 강점</div>
                    </div>
                    <span class="model-check" data-check="gpt">✓</span>
                </div>
                <div class="model-row" data-model="claude">
                    <span class="model-mark mark-claude">C</span>
                    <div style="flex:1;">
                        <div class="model-name">Claude Sonnet 4.6 <span class="badge" style="background:rgba(204,120,92,0.18); color:#cc785c;">긴 문맥</span></div>
                        <div class="model-desc">친절한 설명 · 단계별 풀이에 강함</div>
                    </div>
                    <span class="model-check" data-check="claude" style="display:none;">✓</span>
                </div>
                <div class="model-row" data-model="gemini">
                    <span class="model-mark mark-gem">G</span>
                    <div style="flex:1;">
                        <div class="model-name">Gemini 2.5 Pro <span class="badge" style="background:rgba(138,103,171,0.18); color:#a98cc7;">웹 통합</span></div>
                        <div class="model-desc">실시간 검색 · 최신 기출 분석</div>
                    </div>
                    <span class="model-check" data-check="gemini" style="display:none;">✓</span>
                </div>
            </div>

function attachCodeCopy(scope) {

        btn.dataset.bound = '1';

/* ===== Typing effect ===== */
function typeHtml(target, html) {
    state.isTyping = true;
    // Parse html into virtual DOM; walk text nodes only
    const temp = document.createElement('div');
    temp.innerHTML = html;
    target.innerHTML = '';
    // Clone structure but empty text nodes; we'll fill text node by node
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    // Strategy: clone children sequentially, but for each text node, type char by char.
    typeChildren(temp, target, () => {
        state.isTyping = false;
        attachCodeCopy(target);
    });
}
function typeChildren(srcNode, destNode, done) {
    const children = Array.from(srcNode.childNodes);
    let i = 0;
    function next() {
        if (i >= children.length) { done && done(); return; }
        const node = children[i++];
        if (node.nodeType === Node.TEXT_NODE) {
            // Type characters
            const text = node.textContent;
            const txtNode = document.createTextNode('');
            destNode.appendChild(txtNode);
            let j = 0;
            const speed = Math.max(4, 18 - Math.floor(text.length / 30));
            function typeChar() {
                if (j >= text.length) { next(); return; }
                // Append a small chunk for speed (2-3 chars)
                const chunk = Math.min(3, text.length - j);
                txtNode.textContent += text.substr(j, chunk);
                j += chunk;
                scrollToBottom(true);
                setTimeout(typeChar, speed);
            }
            typeChar();
        } else if (node.nodeType === Node.ELEMENT_NODE) {
            const clone = node.cloneNode(false);
            destNode.appendChild(clone);
            // For pre/code/eq-block/table — instant insert
            if (['PRE', 'TABLE', 'BLOCKQUOTE'].includes(node.tagName) || (clone.classList && (clone.classList.contains('eq-block') || clone.classList.contains('eq-inline')))) {
                clone.innerHTML = node.innerHTML;
                scrollToBottom(true);
                setTimeout(next, 80);
            } else {
                typeChildren(node, clone, next);
            }
        } else {
            next();
        }
    }
    next();
}

<blockquote>더 구체적인 답변을 위해서, <em>어떤 단원인지</em> 또는 <em>어떤 상황에서 막혔는지</em> 알려주시면 정확히 맞춰드릴게요.</blockquote>
<p>예시 질문: "옴의 법칙 설명해줘", "변압기 권수비 공식 정리", "CBT 5회차 오답 분석" 등.</p>`;
}

/* ===== Tool chips ===== */
document.querySelectorAll('.tool-chip').forEach(chip => {
    chip.addEventListener('click', () => {
        const t = chip.dataset.tool;
        state.tools[t] = !state.tools[t];
        chip.classList.toggle('on', state.tools[t]);
        if (state.tools[t]) {
            const names = { attach: '파일을 끌어다 놓으세요', search: '웹 검색이 켜졌습니다', deep: 'DeepResearch 모드 — 답변이 좀 더 걸려요', canvas: '캔버스 모드 — 우측에 작업창이 열립니다' };
            showToast(names[t]);
        }
    });
});

/* ===== Model picker ===== */
$modelPicker.addEventListener('click', (e) => {
    e.stopPropagation();
    $modelMenu.classList.toggle('open');
});
document.addEventListener('click', () => $modelMenu.classList.remove('open'));
document.querySelectorAll('.model-row').forEach(row => {
    row.addEventListener('click', (e) => {
        e.stopPropagation();
        const m = row.dataset.model;
        state.currentModel = m;
        const info = MODEL_INFO[m];
        $currentModelName.textContent = info.name;
        $currentModelBadge.textContent = info.badge;
        $currentModelBadge.style.background = info.color;
        $currentModelBadge.style.color = info.text;
        // Update brand logo
        document.querySelector('.brand-logo').style.background = info.color.replace('0.15', '0.9').replace('0.18', '0.9');
        document.querySelectorAll('[data-check]').forEach(c => c.style.display = c.dataset.check === m ? 'inline' : 'none');
        $modelMenu.classList.remove('open');
        showToast(`${info.name}(으)로 전환됨`);
    });
});

/* ===== New chat ===== */
$newChatBtn.addEventListener('click', () => {
    state.currentChatId = null;
    document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
    $chatInner.innerHTML = `
        <div style="text-align:center; padding: 18vh 20px 0; color: var(--text-mute);">
            <div style="font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 14px;">
                <span style="background: linear-gradient(135deg,#10a37f,#5b8def,#cc785c); -webkit-background-clip: text; background-clip: text; color: transparent;">전기기능사 AI</span>가 도와드릴게요
            </div>
            <div style="font-size: 15px; max-width: 560px; margin: 0 auto;">옴의 법칙부터 실기 시퀀스까지 — 무엇이든 물어보세요. 단계별로 설명하고, 예제와 함께 풀어드립니다.</div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; max-width: 600px; margin: 36px auto 0;">
                ${[
                    ['💡 옴의 법칙 외우는 법', '옴의 법칙 외우기 어려워요'],
                    ['⚙️ 3상 결선 Y/Δ 차이', 'Y결선과 델타결선 차이 알려줘'],
                    ['🔌 변압기 권수비 정리', '변압기 권수비 공식 정리해줘'],
                    ['📊 CBT 점수 올리는 법', 'CBT 52점인데 어떻게 올리지']
                ].map(([t,q]) => `<div class="suggest" data-q="${escapeHtml(q)}" style="border:1px solid var(--border-soft); border-radius:12px; padding:14px 16px; text-align:left; font-size:14px; cursor:pointer; color:var(--text);">${escapeHtml(t)}<div style="color:var(--text-dim); font-size:12px; margin-top:4px;">"${escapeHtml(q)}"</div></div>`).join('')}
            </div>
        </div>`;
    document.querySelectorAll('.suggest').forEach(s => {
        s.addEventListener('click', () => {
            $composerInput.value = s.dataset.q;
            $composerInput.dispatchEvent(new Event('input'));
            sendMessage();
        });
        s.addEventListener('mouseenter', () => s.style.background = 'var(--bg-side-hover)');
        s.addEventListener('mouseleave', () => s.style.background = '');
    });
});

/* ===== Load chat ===== */
function loadChat(chatId) {
    state.currentChatId = chatId;
    renderSidebar();
    renderChat(chatId);
}

/* ===== Helpers ===== */
function scrollToBottom(smooth) {
    $chatScroll.scrollTo({ top: $chatScroll.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
}
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
}
function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
    } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
    }
}
let toastTimer;
function showToast(msg) {
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove('show'), 1800);
}

/* ===== Boot ===== */
renderSidebar();
renderChat(state.currentChatId);
</script>
</body>
</html>
